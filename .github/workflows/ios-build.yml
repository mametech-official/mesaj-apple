name: Apple iOS (Xcode & IPA) Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App & IPA on macOS
    runs-on: macos-latest

    steps:
      - name: Depoyu İndir (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Capacitor iOS Bağımlılıklarını Kur ve CocoaPods Senkronize Et
        run: |
          npm install --no-audit --no-fund
          npx cap sync ios

      - name: Xcode Projesi Derlemesi (iOS Release Build)
        working-directory: ios/App
        run: |
          if [ -d "App.xcworkspace" ]; then
            xcodebuild clean build \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild clean build \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: IPA Paketini Oluştur (Mesaj.ipa)
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Mesaj.ipa Payload

      - name: iOS IPA Paketini Yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Mesaj-Apple-iOS-IPA
          path: |
            ios/App/Mesaj.ipa
          if-no-files-found: warn
